# Explicit opt-in profile; installed as ~/.codex/skillweave-local.config.toml.
# Launch with: codex --profile skillweave-local
# Requires a Codex/server version supporting the Responses API.
model_provider = "skillweave-local"
model = {{MODEL}}
model_context_window = {{CONTEXT}}
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[model_providers.skillweave-local]
name = "Skillweave local server"
base_url = {{BASE_URL}}
wire_api = "responses"
requires_openai_auth = false
